[package]
name = "attack-shark-x3"
version = "0.1.0"
edition = "2024"
description = "Open-source configurator for the ATTACK SHARK X3 mouse (macOS and Linux)"
license = "MIT"

[features]
default = ["ble"]
ble = ["x3-core/ble"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
x3-core = { path = "../crates/x3-core", default-features = false }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
sys-locale = "0.3"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
